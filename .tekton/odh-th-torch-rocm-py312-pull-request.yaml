apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: odh-th-torch-rocm-py312-on-pull-request-{{pull_request_number}}
  labels:
    appstudio.openshift.io/application: rhoai-v3-7-ea-1
    appstudio.openshift.io/component: odh-th-torch-rocm-py312-v3-7-ea-1
    pipelines.appstudio.openshift.io/type: build
  namespace: rhoai-tenant
  annotations:
    pipelinesascode.tekton.dev/on-comment: '^/build-konflux'
    build.appstudio.openshift.io/repo: "https://github.com/red-hat-data-services/distributed-workloads?rev={{revision}}"
    build.appstudio.redhat.com/commit_sha: "{{revision}}"
    build.appstudio.redhat.com/target_branch: "{{target_branch}}"
    build.appstudio.redhat.com/pull_request_number: "{{pull_request_number}}"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/on-cel-expression: |-
      event == "pull_request"
      && target_branch == "rhoai-3.7-ea.1"
      && (("images/universal/training/th-torch-rocm-py312/**".pathChanged() || ".tekton/odh-th-torch-rocm-py312-pull-request.yaml".pathChanged()))
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/rhoai/odh-th-torch-rocm-py312-rhel9:on-pr-{{pull_request_number}}
  - name: rhoai-version
    value: "3.7.0-ea.1"
  - name: dockerfile
    value: Dockerfile.konflux
  - name: path-context
    value: images/universal/training/th-torch-rocm-py312/
  - name: hermetic
    value: "true"
  - name: prefetch-input
    value: |
      [{"type": "pip", "path": "images/universal/training/th-torch-rocm-py312", "requirements_files": ["requirements.txt"], "binary": {"arch": "x86_64", "os": "linux"}}]
  - name: build-args
    value: ["DOWNSTREAM=true"]
  - name: build-platforms
    value:
    - linux/x86_64
  - name: image-expires-after
    value: 30d
  - name: enable-slack-failure-notification
    value: "false"
  pipelineRef:
    params:
    - name: url
      value: https://github.com/red-hat-data-services/konflux-central.git
    - name: revision
      value: 'rhoai-3.7-ea.1'
    - name: pathInRepo
      value: pipelines/multi-arch-container-build.yaml
    resolver: git
  taskRunSpecs:
  - pipelineTaskName: prefetch-dependencies
    computeResources:
      requests:
        cpu: '3'
        memory: 8Gi
      limits:
        cpu: '3'
        memory: 8Gi
  - pipelineTaskName: build-images
    stepSpecs:
    - name: build
      computeResources:
        requests:
          memory: 4Gi
        limits:
          memory: 8Gi
    - name: prepare-sboms
      computeResources:
        requests:
          memory: 4Gi
        limits:
          memory: 8Gi
  - pipelineTaskName: fips-check
    stepSpecs:
    - name: run-fips-check
      computeResources:
        requests:
          memory: 4Gi
        limits:
          memory: 4Gi
  - pipelineTaskName: rpms-signature-scan
    stepSpecs:
    - name: rpms-signature-scan
      computeResources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "500m"
          memory: "1Gi"
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-th-torch-rocm-py312-v3-7-ea-1
    podTemplate:
      imagePullSecrets:
      - name: redhat-appstudio-staginguser-pull-secret
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
  timeouts:
    pipeline: 10h
    tasks: 8h
