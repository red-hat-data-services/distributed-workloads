name: Verify Dependency Graphs

on:
  pull_request:
    paths:
      - 'images/runtime/training/**/Pipfile'
      - 'images/runtime/training/**/Pipfile.lock'
      - 'images/universal/training/**/pyproject.toml'
      - 'images/universal/training/**/requirements.txt'
      - 'hack/verify-runtime-lockfiles.sh'
      - 'hack/verify-universal-requirements.sh'
      - '.github/workflows/verify-requirements.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PIPENV_VERSION: '2026.6.1'
  UV_VERSION: '0.11.29'

jobs:
  verify-runtime:
    name: Verify non-MPI runtime dependency graphs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency tools
        run: python -m pip install "pipenv==$PIPENV_VERSION" "uv==$UV_VERSION"

      - name: Verify lockfile dependency graphs
        run: make verify-runtime-lockfiles

  verify-universal:
    name: Verify universal dependency graphs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"

      - name: Verify requirements dependency graphs
        run: make verify-universal-requirements
